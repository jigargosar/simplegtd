<!doctype html>
<html lang="en" class="[scrollbar-gutter:stable]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimpleGTD</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --color-desk: #5B6157;  --color-paper: #EFEFE8; --color-fill: #DEDED3;
    --color-ink: #191B16;   --color-ink2: #494D44;  --color-soft: #5C6056;
    --color-rule: #7F8278;  --color-pine: #1F4A40;  --color-brick: #7A2E22;
    --font-display: "Newsreader", serif;
    --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
</style>
<style>
  .strike path { transition: stroke-dashoffset .42s cubic-bezier(.4,0,.2,1) }
  dialog::backdrop { background: #191B16; opacity: .5 }
  @media (prefers-reduced-motion: reduce) { *, *::before { transition-duration: .01ms !important } }
</style>
<script type="importmap">
{ "imports": {
  "preact": "https://esm.sh/preact@10",
  "preact/hooks": "https://esm.sh/preact@10/hooks",
  "htm/preact": "https://esm.sh/htm@3/preact?external=preact",
  "lucide-preact": "https://esm.sh/lucide-preact?external=preact"
} }
</script>
</head>
<body class="bg-desk font-sans text-ink antialiased">
<div id="app"></div>
<script type="module">
import { html, render } from 'htm/preact'
import { useState, useEffect, useRef } from 'preact/hooks'
import { Check, Plus, X, ChevronRight, GripVertical, Search } from 'lucide-preact'

let n = 0
const mk = (text, done = false) => ({ id: ++n, text, done })
const seed = [
  { id: 'l1', name: 'Today', open: true, tasks: [mk('Reply to the invoice thread'), mk('Renew the domain before it lapses'), mk('Walk before the light goes'), mk('Pay the electricity bill', true)] },
  { id: 'l2', name: 'This week', open: true, tasks: [mk('Draft the deploy workflow'), mk('Book the dentist for the chipped molar'), mk('Read the notes on fractional indexing', true), mk('Close the second cloud account')] },
  { id: 'l3', name: 'Waiting on', open: true, tasks: [mk('Signed lease from the landlord'), mk('Refund from the airline')] },
  { id: 'l4', name: 'Someday', open: false, tasks: [mk('Learn to make dal from scratch'), mk('Rebuild the old app, one screen at a time'), mk('Fix the wobbly chair')] },
]

const ring = 'focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pine'
const meta = 'font-mono text-[11px] uppercase tracking-[.14em]'

const Row = ({ x, asking, onToggle, onAsk, onKeep, onRemove }) => asking ? html`
  <li class="flex items-center gap-2 rounded-lg bg-fill px-2 py-1.5">
    <p class="min-w-0 flex-1 text-[15px] text-ink2 wrap-anywhere">Remove “${x.text}”?</p>
    <button onClick=${onRemove} class=${'h-9 shrink-0 rounded-md px-3 font-medium text-brick hover:bg-paper ' + meta + ' ' + ring}>Remove</button>
    <button onClick=${onKeep} class=${'h-9 shrink-0 rounded-md px-3 text-ink2 hover:bg-paper ' + meta + ' ' + ring}>Keep</button>
  </li>` : html`
  <li class="group flex items-center gap-1 rounded-lg px-1 hover:bg-fill">
    <button onClick=${onToggle} aria-pressed=${x.done} aria-label=${'Mark ' + x.text + (x.done ? ' not done' : ' done')} class=${'grid size-9 shrink-0 place-items-center rounded-md ' + ring}>
      <span class=${'grid size-5 place-items-center rounded-full border-2 ' + (x.done ? 'border-pine bg-pine text-paper' : 'border-rule')}>
        ${x.done && html`<${Check} class="size-3" stroke-width="3.5" />`}
      </span>
    </button>
    <span class="min-w-0 flex-1 py-2 pr-1">
      <span class="relative inline-block max-w-full">
        <span class=${'block text-[15px] leading-6 wrap-anywhere ' + (x.done ? 'text-ink2' : 'text-ink')}>${x.text}</span>
        <svg class="strike pointer-events-none absolute inset-x-0 top-1/2 h-3 w-full -translate-y-1/2" viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true">
          <path d="M.6 3.5C21 2.1 43 4.3 65 2.9S91 3.2 99.4 2.5" fill="none" class="stroke-ink2" stroke-width=".7" stroke-linecap="round" stroke-dasharray="102" style=${'stroke-dashoffset:' + (x.done ? 0 : 102)} />
        </svg>
      </span>
    </span>
    <span class="grid size-9 shrink-0 cursor-grab place-items-center text-soft opacity-0 group-hover:opacity-100" title="Drag to reorder"><${GripVertical} class="size-4" /></span>
    <button onClick=${onAsk} aria-label=${'Remove ' + x.text} class=${'grid size-9 shrink-0 place-items-center rounded-md text-soft opacity-0 hover:bg-paper hover:text-brick group-hover:opacity-100 focus-visible:opacity-100 ' + ring}><${X} class="size-4" /></button>
  </li>`

const Ghost = ({ label, onAdd, display }) => {
  const [v, setV] = useState('')
  const send = e => { e.preventDefault(); if (v.trim()) { onAdd(v.trim()); setV('') } }
  return html`<form onSubmit=${send} class="flex items-center gap-1 px-1">
    <span class="grid size-9 shrink-0 place-items-center text-soft"><${Plus} class="size-4" /></span>
    <input value=${v} onInput=${e => setV(e.target.value)} placeholder=${label} aria-label=${label}
      class=${'min-w-0 flex-1 rounded-md bg-transparent px-1 py-2 leading-6 text-ink placeholder:text-soft hover:bg-fill focus:bg-fill ' + (display ? 'font-display text-[19px] font-medium' : 'text-[15px]') + ' ' + ring} />
  </form>`
}

const Capture = ({ open, lists, last, onClose, onAdd }) => {
  const box = useRef(), field = useRef()
  const [v, setV] = useState(''), [to, setTo] = useState(last)
  useEffect(() => {
    if (!open) { box.current.close(); document.documentElement.style.overflow = ''; return }
    setTo(last); setV(''); box.current.showModal(); field.current.focus()
    document.documentElement.style.overflow = 'hidden'
  }, [open])
  const send = e => { e.preventDefault(); if (v.trim()) { onAdd(to, v.trim()); onClose() } }
  const name = (lists.find(l => l.id === to) || lists[0]).name
  return html`<dialog ref=${box} onClose=${onClose} onClick=${e => e.target === box.current && onClose()}
    class="m-auto w-[min(30rem,calc(100vw-2rem))] rounded-xl bg-paper p-0 text-ink shadow-2xl">
    <form onSubmit=${send} class="flex flex-col gap-4 p-6">
      <p class=${meta + ' text-ink2'}>Capture</p>
      <input ref=${field} value=${v} onInput=${e => setV(e.target.value)} placeholder="What do you mean to do?" aria-label="New task"
        class=${'w-full rounded-none border-b-2 border-rule bg-transparent px-1 pb-2 font-display text-[21px] text-ink placeholder:text-soft ' + ring} />
      <div class="flex flex-wrap gap-1.5">
        ${lists.map(l => html`<button type="button" onClick=${() => setTo(l.id)}
          class=${'h-9 rounded-full px-3.5 text-[13px] ' + ring + ' ' + (to === l.id ? 'bg-pine font-medium text-paper' : 'border border-rule text-ink2 hover:bg-fill')}>${l.name}</button>`)}
      </div>
      <div class="flex items-center justify-between gap-4 pt-1">
        <p class="font-mono text-[11px] text-ink2">Esc to close</p>
        <button class=${'h-10 rounded-lg bg-pine px-4 text-[14px] font-medium text-paper hover:bg-ink ' + ring}>Add to ${name}</button>
      </div>
    </form>
  </dialog>`
}

const App = () => {
  const [lists, setLists] = useState(seed)
  const [q, setQ] = useState(''), [view, setView] = useState('all')
  const [open, setOpen] = useState(false), [last, setLast] = useState('l1'), [asking, setAsking] = useState(null)

  const onList = (id, f) => setLists(ls => ls.map(l => l.id === id ? f(l) : l))
  const onTasks = (id, f) => onList(id, l => ({ ...l, tasks: f(l.tasks) }))
  const add = (id, text) => { onTasks(id, ts => [...ts, mk(text)]); setLast(id) }

  useEffect(() => {
    const key = e => {
      if (e.key !== 'c' || e.metaKey || e.ctrlKey || /input|textarea/i.test(e.target.tagName)) return
      e.preventDefault(); setOpen(true)
    }
    addEventListener('keydown', key); return () => removeEventListener('keydown', key)
  }, [])

  const needle = q.trim().toLowerCase(), sifting = needle !== '' || view !== 'all'
  const keep = x => x.text.toLowerCase().includes(needle) && (view === 'all' || (view === 'done') === x.done)
  const shown = lists.map(l => ({ ...l, hits: l.tasks.filter(keep) })).filter(l => !sifting || l.hits.length)
  const all = lists.flatMap(l => l.tasks)
  const tally = all.filter(x => !x.done).length + ' open · ' + all.filter(x => x.done).length + ' done'

  return html`
  <main class="mx-auto min-h-screen w-full max-w-xl bg-paper shadow-[0_0_60px_rgba(15,18,14,.35)]">
    <header class="sticky top-0 z-20 border-b border-rule bg-paper/95 px-5 pt-5 pb-3 backdrop-blur-sm">
      <div class="flex items-baseline justify-between gap-4">
        <h1 class="font-display text-[23px] font-semibold tracking-tight">SimpleGTD</h1>
        <p class=${meta + ' shrink-0 tabular-nums text-ink2'}>${tally}</p>
      </div>
      <div class="flex items-center gap-2 pt-3">
        <div class="relative min-w-0 flex-1">
          <${Search} class="pointer-events-none absolute left-2.5 top-1/2 size-4 -translate-y-1/2 text-soft" />
          <input value=${q} onInput=${e => setQ(e.target.value)} placeholder="Filter tasks" aria-label="Filter tasks"
            class=${'h-10 w-full min-w-0 rounded-lg border border-rule bg-paper pl-8 pr-3 text-[15px] placeholder:text-soft ' + ring} />
        </div>
        <div class="flex shrink-0 gap-0.5 rounded-lg border border-rule p-0.5">
          ${['all', 'active', 'done'].map(v => html`<button onClick=${() => setView(v)} aria-pressed=${view === v}
            class=${'h-8 rounded-md px-2.5 ' + meta + ' ' + ring + ' ' + (view === v ? 'bg-pine font-medium text-paper' : 'text-ink2 hover:bg-fill')}>${v}</button>`)}
        </div>
      </div>
    </header>

    ${shown.map(l => {
      const openUp = l.open || sifting
      return html`<section key=${l.id} class="px-5 pt-7">
        <div class="flex items-center gap-2 border-b border-rule pb-1.5">
          <button onClick=${() => onList(l.id, x => ({ ...x, open: !x.open }))} aria-expanded=${openUp}
            class=${'flex h-9 min-w-0 flex-1 items-center gap-1.5 rounded-lg pl-1 pr-2 hover:bg-fill ' + ring}>
            <${ChevronRight} class=${'size-4 shrink-0 text-ink2 transition-transform ' + (openUp ? 'rotate-90' : '')} />
            <h2 class="truncate font-display text-[19px] font-medium">${l.name}</h2>
          </button>
          <span class=${meta + ' shrink-0 tabular-nums text-ink2'}>${l.tasks.filter(x => !x.done).length} open</span>
        </div>
        <div class=${'grid transition-[grid-template-rows] duration-200 ' + (openUp ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]')}>
          <div class="overflow-hidden">
            <ul class="flex flex-col gap-0.5 pt-2">
              ${l.hits.map(x => html`<${Row} key=${x.id} x=${x} asking=${asking === x.id}
                onToggle=${() => onTasks(l.id, ts => ts.map(y => y.id === x.id ? { ...y, done: !y.done } : y))}
                onAsk=${() => setAsking(x.id)} onKeep=${() => setAsking(null)}
                onRemove=${() => { onTasks(l.id, ts => ts.filter(y => y.id !== x.id)); setAsking(null) }} />`)}
            </ul>
            ${!sifting && html`<${Ghost} label="Add a task" onAdd=${text => add(l.id, text)} />`}
          </div>
        </div>
      </section>`
    })}

    ${!shown.length && html`<p class="px-5 pt-10 text-[15px] text-ink2">Nothing here matches. Clear the filter to see everything.</p>`}

    ${!sifting && html`<div class="px-5 pt-8 pb-28">
      <${Ghost} label="New list" display=${true} onAdd=${name => setLists(ls => [...ls, { id: 'l' + ++n, name, open: true, tasks: [] }])} />
    </div>`}
  </main>

  <button onClick=${() => setOpen(true)}
    class=${'fixed bottom-6 right-6 z-30 flex h-12 items-center gap-2 rounded-full bg-pine pl-4 pr-3 text-paper shadow-lg hover:bg-ink ' + ring}>
    <${Plus} class="size-4" /><span class="text-[14px] font-medium">Capture</span>
    <kbd class="rounded bg-paper/25 px-1.5 py-0.5 font-mono text-[11px]">C</kbd>
  </button>

  <${Capture} open=${open} lists=${lists} last=${last} onClose=${() => setOpen(false)} onAdd=${add} />`
}

render(html`<${App} />`, document.getElementById('app'))
</script>
</body>
</html>
